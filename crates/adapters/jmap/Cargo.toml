[package]
name = "fanfold-adapter-jmap"
description = "MailSource adapter: reads new mail over JMAP (via jmap-client) with a persisted cursor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
fanfold-app = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
jmap-client = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
fanfold-domain = { workspace = true }
fanfold-testkit = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
