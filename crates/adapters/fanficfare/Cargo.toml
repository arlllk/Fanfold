[package]
name = "fanfold-adapter-fanficfare"
description = "Downloader adapter: runs FanFicFare in a short-lived, isolated Python process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
fanfold-app = { workspace = true }
fanfold-domain = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
fanfold-testkit = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
