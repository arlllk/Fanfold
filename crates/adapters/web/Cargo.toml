[package]
name = "fanfold-adapter-web"
description = "HTTP adapter: server-rendered UI, live updates (SSE), ops endpoints, RFC 9457 errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
fanfold-app = { workspace = true }
fanfold-domain = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
http = { workspace = true }
jiff = { workspace = true }
maud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The real index (in memory) for the UI tests and the demo.
fanfold-adapter-search = { workspace = true }
fanfold-testkit = { workspace = true }
http-body-util = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
