# A merge into main that changes what goes into the image is a release: a new `vX.Y.Z` tag on
# the merge commit, a GitHub release with generated notes, and the container image published as
# X.Y.Z, X.Y, X (from 1.0) and latest (image.yml, linux/amd64, reproducible).
#
# A merge that changes nothing the image is built from (CI, docs, Renovate config, tests,
# examples, fuzzing, dev tooling) is not released: it would only be the previous image again.
# It is part of the next release instead. The `force` input releases anyway.
#
# The bump comes from the labels of every PR merged since the last release: `release:major`,
# `release:minor`, or `release:patch`; no label means patch, and the biggest wins (so a minor
# PR that was not released on its own still makes the next release a minor one). It is applied
# to the highest existing vX.Y.Z tag (the first release is Cargo.toml's version).
#
# Versions live only in tags: nothing is committed back to main, so a release never puts open
# PRs behind or in conflict. The image is built with the version passed in (FANFOLD_VERSION).
#
# Runs on every push to main (a merge by a person, by Renovate, or by automerge.yml's GitHub
# App), and by hand (workflow_dispatch, e.g. with `force`). Re-running for an already tagged
# commit does nothing. The tag and release are made with the Actions token on purpose: they
# then trigger nothing, so image.yml's own tag trigger does not build the image a second time.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Merge commit on main to release (default the branch head).
        type: string
        default: ""
      force:
        description: Release even if nothing the image is built from changed.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the release
      pull-requests: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ inputs.sha || github.sha }}
      FORCE: ${{ inputs.force || false }}
      # What the image is built from (see the Dockerfile's COPY lines)...
      IMAGE_INPUTS: '^(Dockerfile|\.dockerignore|Cargo\.toml|Cargo\.lock|crates/|python/(pyproject\.toml|uv\.lock)|licenses/|LICENSE-|browser/(Dockerfile|fanfold_browser\.py|pyproject\.toml|uv\.lock))'
      # ...minus what never reaches the binary.
      # (testdata/ is only ever include_str!'d by #[cfg(test)] code.)
      NOT_IMAGE: '^crates/(.+/)?(tests|testdata|examples|benches)/|^crates/testkit/|\.md$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: tag
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main"; exit 1; }

          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if existing=$(git tag --points-at "$SHA" | grep -E "$semver" | head -n1) && [ -n "$existing" ]; then
            echo "$SHA is already released as $existing."
            exit 0
          fi

          last=$(git tag --merged "$SHA" -l 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)

          if [ -n "$last" ] && [ "$FORCE" != true ]; then
            changed=$(git diff --name-only "$last" "$SHA")
            inputs=$(grep -E "$IMAGE_INPUTS" <<<"$changed" | grep -vE "$NOT_IMAGE" || true)
            if [ -z "$inputs" ]; then
              echo "Nothing the image is built from changed since $last: no release."
              echo "Changed: $(tr '\n' ' ' <<<"$changed")"
              exit 0
            fi
            printf 'Image inputs changed since %s:\n%s\n' "$last" "$inputs"
          fi

          # Every PR merged since the last release counts, not only this one.
          labels=""
          for c in $(git rev-list --first-parent "${last:+$last..}$SHA"); do
            labels+=" $(gh api "repos/$GH_REPO/commits/$c/pulls" \
                          --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(" ")')"
          done
          labels=$(tr ' ' '\n' <<<"$labels" | sort -u | tr '\n' ' ')
          case " $labels " in
            *" release:major "*) bump="major" ;;
            *" release:minor "*) bump="minor" ;;
            *) bump="patch" ;;
          esac
          echo "PR labels: ${labels:-none} -> $bump"

          # Retried in case another release took the version first.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --force --tags origin
            latest=$(git tag -l 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)
            if [ -z "$latest" ]; then
              next="v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
            else
              IFS=. read -r major minor patch <<<"${latest#v}"
              case $bump in
                major) next="v$((major + 1)).0.0" ;;
                minor) next="v$major.$((minor + 1)).0" ;;
                patch) next="v$major.$minor.$((patch + 1))" ;;
              esac
            fi
            [[ "$next" =~ $semver ]] || { echo "::error::bad version '$next'"; exit 1; }
            if gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$next" -f sha="$SHA" >/dev/null; then
              echo "Tagged $SHA as $next (after ${latest:-no release})."
              echo "version=${next#v}" >> "$GITHUB_OUTPUT"
              gh release create "$next" --verify-tag --generate-notes --title "$next"
              exit 0
            fi
            echo "Could not create $next (taken?); retrying."
            sleep $((attempt * 3))
          done
          exit 1

  image:
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
    with:
      version: ${{ needs.tag.outputs.version }}

  # fanfold-browser, released with the same version as Fanfold (they are used together).
  browser-image:
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/browser-image.yml
    with:
      version: ${{ needs.tag.outputs.version }}

  # The release's software bill of materials, and signed statements about the image. All of it
  # lives NEXT to the image (release assets, and attestations stored in the registry as
  # referrers of the digest), never inside it, so the image digest stays reproducible.
  #  * SBOMs (Syft), SPDX and CycloneDX: Debian packages, the Python venv, and the Rust crates
  #    (cargo-auditable embeds them in the binary). Attached to the GitHub release.
  #  * Attestations, signed with GitHub's Sigstore identity for this workflow: build provenance
  #    (which commit and workflow made this digest) and the SPDX SBOM. Check them with
  #      gh attestation verify oci://ghcr.io/arlllk/fanfold:X.Y.Z -R arlllk/Fanfold
  #  * A vulnerability scan of the SBOM, uploaded to the repository's Security tab (code
  #    scanning). scan.yml re-scans the latest release daily, for CVEs published later.
  sbom:
    needs: [tag, image]
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # release assets
      packages: write # attestations are pushed to the registry
      id-token: write # Sigstore signing
      attestations: write
      security-events: write # code scanning upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.tag.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The released commit: its Dockerfile names the base image whose VEX the scan uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ env.VERSION }}
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM, SPDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.57.2
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: fanfold-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM, CycloneDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.57.2
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: cyclonedx-json
          output-file: fanfold-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOMs to the release
        run: gh release upload "v$VERSION" "fanfold-$VERSION.spdx.json" "fanfold-$VERSION.cdx.json" --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: fanfold-${{ env.VERSION }}.spdx.json
          push-to-registry: true

      # Docker's VEX statements for the DHI base (scripts/dhi_vex.py), so what Docker found does
      # not affect it stays out of the Security tab. Attached to the release as well: it is
      # what explains every finding a scan of the SBOM reports that the Security tab does not.
      - name: VEX for the base image
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          python3 -I -B scripts/dhi_vex.py --dockerfile Dockerfile --output "fanfold-$VERSION.openvex.json"
          gh release upload "v$VERSION" "fanfold-$VERSION.openvex.json" --clobber

      - name: Vulnerability scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # renovate: datasource=github-releases depName=anchore/grype
          grype-version: v0.122.1
          sbom: fanfold-${{ env.VERSION }}.spdx.json
          vex: fanfold-${{ env.VERSION }}.openvex.json
          fail-build: false
          output-format: sarif

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-image

  # CI on main itself, beside the release (it does not gate it: the PR already passed). This is
  # what fills the Rust cache the PRs read; the image cache is filled by the publish above.
  warm-cache:
    permissions:
      contents: read
      packages: write # required by the called workflows, unused here
    uses: ./.github/workflows/ci.yml
    with:
      image: false
