# Builds the container image, smoke-tests it hardened (read-only root, no capabilities, a
# non-default uid), and, for a release, publishes it to ghcr.io/<owner>/<repo>.
#
# Called by ci.yml (build + smoke test, nothing published) and by release.yml (publish
# version X.Y.Z). A `vX.Y.Z` tag pushed by hand publishes too. Images are only ever tagged
# with semver (X.Y.Z, X.Y, and X once X >= 1) plus `latest`, and only for linux/amd64.
#
# Cost control, in order of effect:
#  * the Dockerfile separates the dependency build from our own code (cargo-chef), and every
#    layer is exported to the GitHub Actions cache by releases, so a source change recompiles
#    only our crates and a dependency change is the only expensive build;
#  * pull requests read that cache but never write it (no cache churn, and a PR cannot
#    poison it);
#  * one runner, one platform (linux/amd64: emulated arm64 is ~10x slower), and the publish
#    step re-uses the layers the test step just built, so nothing is compiled twice.
name: image

on:
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 1.4.2). Empty: build and test only."
        type: string
        default: ""
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z). Empty: build and test only."
        type: string
        default: ""

permissions: {}

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # releases only; read-only for forks automatically
    steps:
      # The version to publish: the caller's input, or the tag a hand-pushed tag run is for.
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          v="${INPUT_VERSION:-$TAG}"
          v="${v#v}"
          if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a semver release version: '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "publish=true"; else echo "publish=false"; fi >> "$GITHUB_OUTPUT"

      # A release builds exactly the tagged commit, whatever main has moved on to since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.version != '' && format('refs/tags/v{0}', steps.version.outputs.version) || '' }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Registry names must be lowercase, and the repository is `arlllk/Fanfold`.
      # Reproducible builds: every timestamp in the image is the commit's (buildx passes
      # SOURCE_DATE_EPOCH to the build, and `rewrite-timestamp=true` below clamps file times).
      - name: Image name, build time
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # `context: git`: labels describe the checked-out commit (the tag), not the event's, and
      # `created` is the commit time, so rebuilding a commit gives the same labels.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          # Semver only; `value` makes the tags independent of the event and ref.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish }}

      # Build once into the local image store; publishing later re-uses these layers.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          # Into the local image store (what `load: true` does), with reproducible timestamps.
          outputs: type=docker,rewrite-timestamp=true
          provenance: false
          sbom: false
          tags: fanfold:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FANFOLD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=image
          # Only releases write the cache: pull requests read it and never write it.
          cache-to: ${{ steps.version.outputs.publish == 'true' && 'type=gha,scope=image,mode=max,ignore-error=true' || '' }}

      # The image has to work the way it is meant to be deployed: read-only root, no
      # capabilities, no privilege escalation, an arbitrary uid, and only the three writable
      # directories mounted (as empty tmpfs). `check-config` needs no network or database.
      - name: Smoke test, hardened
        env:
          UID_X: "4242"
          GID_X: "10001"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/config.toml" <<'TOML'
          [database]
          host = "postgres"
          name = "fanfold"
          user = "fanfold"
          password = { env = "DB_PASSWORD" }
          [library]
          path = "/library"
          [downloader]
          python = "/opt/venv/bin/python"
          [downloader.flaresolverr]
          url = "http://flaresolverr:8191"
          TOML

          hardened=(--read-only --cap-drop ALL --security-opt no-new-privileges
            --user "$UID_X:$GID_X"
            --tmpfs "/tmp/fanfold:rw,nosuid,nodev,noexec,mode=0770,uid=$UID_X,gid=$GID_X"
            --tmpfs "/run/fanfold:rw,nosuid,nodev,noexec,mode=0700,uid=$UID_X,gid=$GID_X"
            --tmpfs "/library:rw,nosuid,nodev,noexec,mode=0770,uid=$UID_X,gid=$GID_X"
            -e DB_PASSWORD=ci
            -v "$RUNNER_TEMP/config.toml:/etc/fanfold/config.toml:ro")

          echo "::group::configuration is valid"
          docker run --rm "${hardened[@]}" fanfold:ci check-config
          echo "::endgroup::"

          echo "::group::FanFicFare is importable by the pinned interpreter"
          docker run --rm "${hardened[@]}" --entrypoint /opt/venv/bin/python fanfold:ci \
            -I -c "import fanficfare; print('FanFicFare', fanficfare.__file__)"
          echo "::endgroup::"

          echo "::group::the root filesystem really is read-only, and the mounts really are writable"
          docker run --rm "${hardened[@]}" --entrypoint sh fanfold:ci -c '
            for p in /etc /usr /opt/venv /home; do
              if touch "$p/probe" 2>/dev/null; then echo "FAIL: $p is writable"; exit 1; fi
            done
            for p in /tmp/fanfold /run/fanfold /library; do
              touch "$p/probe" || { echo "FAIL: $p is not writable"; exit 1; }
            done
            test "$(id -u)" != 0 || { echo "FAIL: running as root"; exit 1; }
            echo ok'
          echo "::endgroup::"

          echo "::group::and as the image default user, with nothing mounted at all"
          docker run --rm -e DB_PASSWORD=ci -v "$RUNNER_TEMP/config.toml:/etc/fanfold/config.toml:ro" \
            --read-only --cap-drop ALL fanfold:ci check-config
          echo "::endgroup::"

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer is a cache hit: this only pushes.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          # Pushed with the same reproducible timestamps. No provenance/SBOM attestation
          # manifests: they record the build's own time and runner, so they would give every
          # rebuild a new digest; the published digest is the image itself, and rebuilding
          # the tag reproduces it.
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FANFOLD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=image
