# Builds the fanfold-browser image (browser/Dockerfile), smoke-tests it hardened (read-only root,
# no capabilities, a volume for the profile) without ever contacting a site, and, for a release,
# publishes it to ghcr.io/<owner>/<repo>-browser with the same semver tags as Fanfold's image.
#
# Called by ci.yml when browser/ changed (build + smoke test, nothing published) and by
# release.yml (publish version X.Y.Z). One platform, linux/amd64, like the main image.
#
# PERMISSIONS: none declared here on purpose, so each run gets exactly what its caller's job
# grants. A pull request's CI (ci.yml) grants `contents: read` only, so the job that builds a
# PR's new dependencies (in BuildKit, and runs them in the smoke test) holds no token that can
# push an image; only release.yml grants `packages: write`. (A job declaring `packages: write`
# would need every caller to grant it, PRs included.) For the same reason this workflow has no
# trigger of its own: release from release.yml (`gh workflow run release.yml`).
#
# CACHE. Releases do not read the GitHub Actions cache: any job on main can write it, and
# main's CI (release.yml, warm-cache) runs every dependency's build scripts and tests on the
# runner, so a malicious dependency could plant cache entries that a release would then
# build from. A release builds everything from scratch (once a week) and then writes the cache
# for pull requests, which only ever read it.
name: browser-image

on:
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 1.4.2). Empty: build and test only."
        type: string
        default: ""
    outputs:
      digest:
        description: The published image's digest (empty when nothing was published).
        value: ${{ jobs.image.outputs.digest }}

# No `permissions:` (see PERMISSIONS above): the caller's job decides.

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a semver release version: '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "publish=true"; else echo "publish=false"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.version != '' && format('refs/tags/v{0}', steps.version.outputs.version) || '' }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-browser" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: browser/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fanfold-browser:ci
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests read the cache; releases never do (see CACHE above), and are the only
          # ones that write it.
          cache-from: ${{ steps.version.outputs.publish != 'true' && 'type=gha,scope=browser' || '' }}
          cache-to: ${{ steps.version.outputs.publish == 'true' && 'type=gha,scope=browser,mode=max' || '' }}

      # Hardened, as deployed: the service must start, and answer /health, which never touches
      # a site (no AO3 traffic from CI).
      - name: Smoke test
        run: |
          set -euo pipefail
          docker volume create browser-profile >/dev/null
          docker run -d --name browser --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,uid=10001,gid=10001 -v browser-profile:/data \
            -p 127.0.0.1:8191:8191 fanfold-browser:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8191/health; then echo; ok=1; break; fi
            sleep 1
          done
          docker logs browser
          [ "${ok:-}" = 1 ] || { echo "::error::fanfold-browser did not answer /health"; exit 1; }
          # A host that is not allowed is refused before any browser starts.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"url":"https://example.org/"}' \
            http://127.0.0.1:8191/fetch)
          [ "$status" = 403 ] || { echo "::error::expected 403 for a foreign host, got $status"; exit 1; }
          docker rm -f browser >/dev/null

      - name: Log in to ghcr.io
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: publish
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: browser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
