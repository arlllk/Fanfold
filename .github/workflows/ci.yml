# The checks every pull request has to pass. `ci-ok` is the one required status check (see the
# ruleset on main); it sums up the jobs above it, so a skipped job (docs-only change) is fine
# and a failed or cancelled one is not.
#
# Triggers:
#  * pull_request: every PR, including Renovate's and forks' (forks get a read-only token and
#    no secrets). Except drafts: a draft runs nothing (no CI minutes while work is in progress),
#    not even ci-ok, so it cannot look green; marking it ready for review starts CI;
#  * workflow_dispatch: by hand, to re-run CI on a branch;
#  * workflow_call: release.yml re-runs it on main, which is also what fills the caches PRs
#    read (GitHub only shares caches from the default branch).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: Also build and smoke-test the container image.
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Docs-only changes skip the expensive jobs (their checks report "skipped", which ci-ok
  # accepts). On main everything always runs.
  changes:
    # Drafts: nothing runs (outside a pull_request event there is no draft, so this is true).
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "browser=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1   # the checkout is the PR merged into its base
          else
            base=$(git merge-base origin/main HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed:\n%s\n' "$changed"
          if grep -qvE '^docs/|\.md$' <<<"$changed"; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          if grep -qE '^(browser/|\.github/workflows/browser-image\.yml$)' <<<"$changed"; then
            browser=true; else browser=false; fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache; PRs read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      # The self-hosted scripts are the ones the vendor lock names (a Renovate bump fails here
      # until vendor-sync.yml has pushed its files), and the committed app.css is what the
      # locked Tailwind builds from the views.
      - name: Web assets
        run: |
          set -euo pipefail
          python3 -I scripts/vendor.py check
          python3 -I scripts/vendor.py css --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # `just integration`, spelled out: a throwaway PostgreSQL (the runner ships one, not
      # started) and the pinned FanFicFare against its offline test site. No network needed.
      # The uv the image is built with (the Dockerfile's uv stage; Renovate moves both together),
      # downloaded only if its checksum is known to the action.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
          version: "0.13.10"
          require-checksums: true
          enable-cache: false

      # The FanFicFare the image ships: the same python/uv.lock (and --locked fails if
      # pyproject.toml and the lock disagree), on the image's Python minor version (the
      # Dockerfile's python-base; keep in step with it).
      - name: Integration setup
        run: |
          set -euo pipefail
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)
          echo "$pg_bin" >> "$GITHUB_PATH"
          UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --project python --locked --no-build --python 3.15
          echo "FFD_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Integration, PostgreSQL contracts
        run: scripts/with-postgres.sh cargo test --locked -p fanfold-adapter-postgres -- --ignored

      - name: Integration, Python worker
        run: |
          set -euo pipefail
          "$(dirname "$FFD_PYTHON")/pyrefly" check --config crates/adapters/fanficfare/worker/pyrefly.toml \
            --python-interpreter-path "$FFD_PYTHON"
          "$(dirname "$FFD_PYTHON")/pyrefly" check --config scripts/pyrefly.toml \
            --python-interpreter-path "$FFD_PYTHON"
          "$(dirname "$FFD_PYTHON")/pyrefly" check --config crates/adapters/web/tests/browser/pyrefly.toml \
            --python-interpreter-path "$FFD_PYTHON"
          "$FFD_PYTHON" -I -B -m unittest discover -s crates/adapters/fanficfare/worker
          "$FFD_PYTHON" -I -B -m unittest discover -s scripts
          cargo test --locked -p fanfold-adapter-fanficfare -- --ignored

      # fanfold-browser's queue, pacing and cool-down, with a fake browser (no Camoufox, no
      # network); and its lock must match its pyproject.toml.
      - name: Browser service
        run: |
          set -euo pipefail
          python3 -I -B -m unittest discover -s browser
          uv lock --project browser --check

      # The UI in a real browser (the runner's Google Chrome, Playwright from the venv): the
      # parts a bump of htmx or Alpine could break without any Rust test noticing.
      - name: Web UI in a browser
        run: |
          set -euo pipefail
          cargo build --locked -p fanfold-adapter-web --example demo
          "$FFD_PYTHON" -I -B -m unittest discover -s crates/adapters/web/tests/browser

      - name: Integration, end to end
        run: scripts/with-postgres.sh cargo test --locked -p fanfold-server --test e2e -- --ignored

  image:
    needs: changes
    # As a string: outside workflow_call the input is null, and null == false in expressions.
    if: needs.changes.outputs.code == 'true' && format('{0}', inputs.image) != 'false'
    # Read-only: the image built here contains this PR's dependencies, and the called workflow
    # gets exactly this token (it declares no permissions of its own).
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}

  browser-image:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && format('{0}', inputs.image) != 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/browser-image.yml

  ci-ok:
    # always(): sum up failed and skipped jobs too; but not for a draft, where everything was
    # skipped on purpose and a green ci-ok would be a lie.
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, rust, image, browser-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          [ "$FAILED" = false ]
