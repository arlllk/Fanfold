# Every branch pushed here gets a pull request into main, so no change lands without one.
#
# The PR takes its title and body from the branch's first commit, starts with the
# `release:patch` label (swap it for `release:minor` or `release:major` to choose the version
# bump, see release.yml) and is assigned to whoever pushed. Open it as, or convert it to, a
# draft to keep it from being merged automatically (automerge.yml).
#
# It is opened by the repository's GitHub App (secrets RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY),
# not the Actions token: a PR the Actions bot opens triggers no workflows and, in a public repo,
# would wait for a maintainer to approve its CI. The app's PR triggers CI like anyone's.
name: pr

on:
  push:
    branches-ignore:
      - main
      - "renovate/**" # Renovate opens its own

permissions: {}

jobs:
  open:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout only; the PR is opened with the app's token
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      PUSHER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A token for this repository only, with only what opening a PR needs; it expires in an
      # hour and is revoked when the job ends.
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open; CI runs on it as usual."
            exit 0
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then
            echo "$BRANCH has no commits that main does not; nothing to propose."
            exit 0
          fi
          # Someone (or `gh pr create`) may have opened it a moment ago: not an error.
          if ! gh pr create --base main --head "$BRANCH" --fill-first \
              --label release:patch --assignee "$PUSHER"; then
            if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
              echo "Opened concurrently."
              exit 0
            fi
            exit 1
          fi
