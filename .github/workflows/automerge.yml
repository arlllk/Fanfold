# Merges a pull request once the repository owner has approved it and CI has passed, whichever
# comes last. Both must be about the PR's latest commit: `ci-ok` green on it, and the owner's
# most recent review an approval of it (an approval of an older commit does not count: approve
# again after a push). The merge goes out with the weekly release, or at once if the PR is
# labelled `release:now` (release.yml).
#
# Any PR from a branch of this repository qualifies: Renovate's, lock-maintenance.yml's, and the
# ones pr.yml opens for pushed branches. Never a fork's, a draft, or one labelled
# `no-automerge`. (GitHub does not let anyone approve their own PR. pr.yml's PRs are opened by
# the GitHub App, so the owner can approve those; a PR the owner opened by hand is merged by
# hand.) The ruleset on main still applies: `ci-ok` must be green or the merge is refused.
#
# Started when a CI run ends, and when a review.yml run ends (a submitted approval starts one).
# Both are workflow_run events, so this always runs main's copy of this file, never a PR's, and
# never checks out PR code: no file a PR can change ever sees the GitHub App's key.
#
# The merge is made with the repository's GitHub App (secrets RELEASE_APP_ID,
# RELEASE_APP_PRIVATE_KEY): a merge by the Actions token would not trigger the push to main
# that release.yml listens for. Everything before it is read with the Actions token.
name: automerge

on:
  workflow_run:
    workflows: [ci, review]
    types: [completed]

permissions: {}

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["pull_request", "pull_request_review", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      checks: read # ci-ok on the PR's commit
      pull-requests: read # the PR and its reviews
    env:
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Eligible?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --base main --state open \
                 --json number,headRefOid,isDraft,labels,isCrossRepository \
                 --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "No open PR into main for $BRANCH."; exit 0; fi
          n=$(jq -r .number <<<"$pr")

          why=$(jq -r --arg sha "$SHA" '
            if .isCrossRepository then "it comes from a fork"
            elif .headRefOid != $sha then "this run was for \($sha), but the PR is now at \(.headRefOid)"
            elif .isDraft then "it is a draft"
            elif any(.labels[]; .name == "no-automerge") then "it is labelled no-automerge"
            else ""
            end' <<<"$pr")
          if [ -n "$why" ]; then echo "Not merging #$n: $why."; exit 0; fi

          # CI: a green ci-ok on exactly this commit (a review can come before CI ends).
          ci=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?check_name=ci-ok" \
                 --jq '[.check_runs[].conclusion] | if any(. == "success") then "success" else (.[0] // "not run yet") end')
          if [ "$ci" != success ]; then echo "Not merging #$n: ci-ok is '$ci' on $SHA."; exit 0; fi

          # Approval: the owner's latest approving/rejecting review, which must approve this commit.
          # (Comments do not change it; a dismissed approval no longer counts.)
          last=$(gh api --paginate "repos/$GH_REPO/pulls/$n/reviews" \
                   --jq ".[] | select(.user.login == \"$OWNER\" and (.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\" or .state == \"DISMISSED\")) | \"\(.state) \(.commit_id)\"" \
                 | tail -n1)
          if [ "$last" != "APPROVED $SHA" ]; then
            echo "Not merging #$n: not approved by $OWNER on $SHA (latest review: ${last:-none})."
            exit 0
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"

      # This repository only, only what merging needs (`workflows`: a PR may change files in
      # .github/workflows); expires in an hour, revoked when the job ends.
      - id: app
        if: steps.check.outputs.number != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Merge
        if: steps.check.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ steps.check.outputs.number }}
        run: |
          set -euo pipefail
          # --match-head-commit: refuse if anything was pushed after the commit checked above.
          # (The branch is deleted by the repository's "delete head branches" setting.)
          gh pr merge "$N" --merge --match-head-commit "$SHA"
          echo "Merged #$N; it goes out with the next release (at once if labelled release:now)."
