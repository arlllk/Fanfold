# The Python side of Fanfold: FanFicFare, which the worker runs as a subprocess, and nothing
# else. Not a package (nothing here is installed as a project); uv.lock pins every dependency
# under it, with hashes, for every Python version and platform. Renovate keeps both current.
#
#   uv sync --project python --locked     # what `just venv`, CI and the image build all do
#   uv lock --project python              # after editing this file
[project]
name = "fanfold-python"
version = "0"
description = "FanFicFare, pinned, for the fanfold worker"
requires-python = ">=3.13"
dependencies = [
  "fanficfare==4.63.0",
]

[tool.uv]
package = false
