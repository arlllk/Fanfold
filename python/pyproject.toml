# The Python side of Fanfold: FanFicFare, which the worker runs as a subprocess, and nothing
# else. Not a package (nothing here is installed as a project); uv.lock pins every dependency
# under it, with hashes, for every Python version and platform. Renovate keeps both current.
#
#   uv sync --project python --locked     # what `just venv`, CI and the image build all do
#   uv lock --project python              # after editing this file
[project]
name = "fanfold-python"
version = "0"
description = "FanFicFare, pinned, for the fanfold worker"
requires-python = ">=3.13"
dependencies = [
  "fanficfare==4.63.0",
]

# Development only: `uv sync` installs it for the tests and CI; the image's `--no-dev` does not.
[dependency-groups]
dev = [
  "pyrefly==1.5.0", # type-checks the worker against FanFicFare (crates/adapters/fanficfare/worker)
  "playwright==1.65.2", # drives the web UI in a real browser (`just test-ui-browser`)
]

[tool.uv]
package = false
# Wheels only, for every uv command here (CI, the image, uv lock, and Renovate's own runs on its
# servers): a source distribution would run its build code just by being installed or locked.
no-build = true
