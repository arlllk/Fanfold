[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/testkit",
    "crates/adapters/fs",
    "crates/adapters/jmap",
    "crates/adapters/web",
    "crates/adapters/fanficfare",
    "crates/adapters/discord",
    "crates/adapters/postgres",
    "crates/adapters/epub",
    "crates/adapters/search",
    "crates/server",
    # cargo-fuzz targets; built with `just fuzz` (needs nightly).
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/arlllk/Fanfold"
license = "0BSD OR MIT OR Apache-2.0"

# ---------------------------------------------------------------------------
# Every third-party version lives here and nowhere else. Member crates say
# `dep = { workspace = true }` (plus features), never a version.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# internal crates
fanfold-domain = { path = "crates/domain" }
fanfold-app = { path = "crates/app" }
fanfold-testkit = { path = "crates/testkit" }
fanfold-adapter-fs = { path = "crates/adapters/fs" }
fanfold-adapter-jmap = { path = "crates/adapters/jmap" }
fanfold-adapter-fanficfare = { path = "crates/adapters/fanficfare" }
fanfold-adapter-discord = { path = "crates/adapters/discord" }
fanfold-adapter-postgres = { path = "crates/adapters/postgres" }
fanfold-adapter-epub = { path = "crates/adapters/epub" }
fanfold-adapter-search = { path = "crates/adapters/search" }
fanfold-adapter-web = { path = "crates/adapters/web" }
fanfold-server = { path = "crates/server" }

# runtime / core
tokio = { version = "1.54", default-features = false }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
http = "1"
# time: jiff (chrono is on a soft-deprecation path, chronotope/chrono#1768)
jiff = { version = "1.0", default-features = false, features = ["std", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }

# web
axum = { version = "0.8.9", default-features = false }
maud = "0.27.0"
tokio-stream = { version = "0.1.19", default-features = false }
tower = { version = "0.5.3", default-features = false }
http-body-util = "0.1.5"
# static file names (content hashes) and the per-page CSP nonce
sha2 = { version = "0.11.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }

# mail
# Stalwart's own JMAP client. No websockets: we only need HTTP and the event stream.
jmap-client = { version = "0.4.3", default-features = false, features = ["async", "aws_lc_rs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# adapters
reqwest = { version = "0.13.5", default-features = false }
sqlx = { version = "0.9.0", default-features = false }
secrecy = "0.10.3"
toml = "1.2.1"
tempfile = "3.27.0"

# EPUB finishing: rewriting the package, rendering the cover
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
resvg = { version = "0.50.0", default-features = false, features = ["text"] }
# text measurement for the cover; the font parser resvg (usvg) already uses
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }

# library search: an in-memory index (no mmap, no compression: nothing is ever written to disk)
tantivy = { version = "0.27.0", default-features = false }

# testing
proptest = "1.12.0"
mockall = "0.15.0"
libfuzzer-sys = "0.4.13"

# ---------------------------------------------------------------------------
# Strict lints, inherited by every crate via `[lints] workspace = true`.
# CI runs `cargo clippy --workspace --all-targets -- -D warnings`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
# No panics in production paths (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
panic_in_result_fn = "deny"
# Observability goes through tracing, not stdout.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Hygiene
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
rc_mutex = "deny"
str_to_string = "deny"
clone_on_ref_ptr = "deny"
# Pedantic lints we deliberately relax
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Nursery lints that are noise here
significant_drop_tightening = "allow"
option_if_let_else = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
